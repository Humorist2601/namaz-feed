name: Update namaz feed

on:
  schedule:
    # The daily run is started at 21:00 Pakistan time by an outside timer (cron-job.org,
    # through workflow_dispatch below), because GitHub's own schedule often starts runs
    # hours late in the evening, or skips them. This schedule is only the backup:
    # 16:17 UTC = 21:17 PKT, so if the timer misses a day the item still arrives, late.
    # Not on the hour: GitHub delays or drops scheduled runs at the start of busy hours.
    - cron: "17 16 * * *"
  workflow_dispatch:        # the 21:00 timer, or a manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write  # lets the run save newly fetched timings in data/
  pages: write
  id-token: write
  actions: write   # lets the keep-alive step stop GitHub pausing this schedule

# One run at a time. A run that starts while another is going waits for it instead of
# cancelling it, so a push at 21:00 doesn't cancel the timer's run halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a stuck run is stopped instead of holding the queue for hours
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Headless Chromium draws each day's card image (card.py); Pillow compresses them.
      # Downloads are retried, and if they still fail the run carries on: the feed goes
      # out with text only rather than not at all.
      - name: Install card renderer
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            pip install playwright==1.63.0 pillow && python -m playwright install chromium && exit 0
            echo "::warning::Install attempt $attempt failed; retrying in 20 s."
            sleep 20
          done
          exit 1

      - name: Generate feed
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml
        run: python generate_feed.py

      # Save any month of timings fetched this run, so later runs read it instead of the API.
      # Commits made with the workflow's token don't start another run.
      - name: Save fetched timings
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "No new timings to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save prayer timings data"
          git pull --rebase origin main && git push origin HEAD:main \
            || echo "::warning::Couldn't save timings; the next run will fetch them again."

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # This re-enables the workflow via the API, resetting that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable"
