name: Update namaz feed

on:
  schedule:
    # 09:47 UTC = 14:47 in Pakistan (PKT, UTC+5): publishes tomorrow's timings.
    # GitHub often starts scheduled runs hours late (they ran 4-6 h late at 15:43 UTC, the
    # US mid-morning peak), so this starts early enough to arrive before 21:00 even then.
    # Not on the hour: GitHub delays or drops scheduled runs at the start of busy hours.
    - cron: "47 9 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write  # lets the run save newly fetched timings in data/
  pages: write
  id-token: write
  actions: write   # lets the keep-alive step stop GitHub pausing this schedule

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Headless Chromium draws each day's card image (card.py); Pillow compresses them.
      - name: Install card renderer
        run: |
          pip install playwright==1.63.0 pillow
          python -m playwright install --with-deps chromium

      - name: Generate feed
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml
        run: python generate_feed.py

      # Save any month of timings fetched this run, so later runs read it instead of the API.
      # Commits made with the workflow's token don't start another run.
      - name: Save fetched timings
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "No new timings to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save prayer timings data"
          git pull --rebase origin main && git push origin HEAD:main \
            || echo "::warning::Couldn't save timings; the next run will fetch them again."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # This re-enables the workflow via the API, resetting that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable"
