name: Update namaz feed

on:
  schedule:
    - cron: "0 16 * * *"   # 16:00 UTC = 21:00 in Pakistan (PKT, UTC+5)
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the keep-alive step stop GitHub pausing this schedule

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Headless Chromium draws each day's card image (card.py).
      - name: Install card renderer
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Generate feed
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml
        run: python generate_feed.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # This re-enables the workflow via the API, resetting that timer (no commits made).
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable"
